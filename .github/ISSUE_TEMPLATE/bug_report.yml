name: Bug report
description: Report a reproducible bug or unexpected behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. This report is public: do not include confidential data, credentials, personal information, or private logs. Report vulnerabilities through the affected repository's Security policy instead.
  - type: input
    id: affected
    attributes:
      label: Affected component and version
      description: Identify the repository, component, and version or commit, if known.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Description and impact
      description: Clearly describe the unexpected behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps or a sanitized example. If reproduction is uncertain, explain what you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include only sanitized output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share relevant operating system, browser, runtime, or configuration details. State if not applicable.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or other relevant details.
