name: Feature or enhancement request
description: Propose a new capability or improvement to existing behavior.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing requests first. This request is public: do not include confidential data, credentials, or personal information.
  - type: input
    id: affected
    attributes:
      label: Affected component
      description: Identify the repository or component this request concerns.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem, motivation, and use cases
      description: Explain what need this addresses, who benefits, and relevant use cases.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior or solution. A specific implementation is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing options or workarounds, if any.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How could a reviewer verify that the request has been addressed?
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant references, mockups, or context.
